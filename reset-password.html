<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TABA · Passwort zurücksetzen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#183f34;--g2:#245b49;--gold:#b99a59;--ink:#1d2a25;--muted:#718078;--line:#e2e7e1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f6f2;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 10px 36px #1b3a2d0c}
.brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{color:var(--g);font-size:26px;margin:8px 0}p{color:var(--muted)}
label{display:block;font-weight:650;font-size:14px;margin:16px 0 6px}
input{width:100%;padding:13px;border:1px solid #d6ded7;border-radius:10px;font:inherit}
button{margin-top:20px;padding:13px 18px;border:0;border-radius:10px;background:var(--g);color:white;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.msg{padding:12px;border-radius:10px;margin-top:15px;background:#eef4ef;color:var(--g)}.err{background:#fff0ee;color:#a34238}.hidden{display:none}
a{color:var(--g)}
</style>
</head>
<body>
<main>
<div class="brand">Pedigree of Pigeons · by TABA</div>
<h1>Neues Passwort festlegen</h1>
<p>Lege hier ein neues Passwort für dein TABA-Konto fest.</p>
<div id="loading" class="msg">Prüfe den Wiederherstellungslink …</div>
<form id="form" class="hidden">
<label for="pw">Neues Passwort</label>
<input id="pw" type="password" minlength="8" autocomplete="new-password" required placeholder="Mindestens 8 Zeichen">
<label for="pw2">Passwort wiederholen</label>
<input id="pw2" type="password" minlength="8" autocomplete="new-password" required placeholder="Passwort erneut eingeben">
<button id="save" type="submit">Neues Passwort speichern</button>
</form>
<div id="message" class="hidden"></div>
<p class="hidden" id="back"><a href="/">Zur Anmeldung</a></p>
</main>
<script>
const URL="https://zntuhivibdibocuarewa.supabase.co";
const KEY="sb_publishable_ZN7AZVgXHek1T7dGUFMU_Q_7UUKXo12";
const sb=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
function show(text,error=false){$("message").textContent=text;$("message").className="msg"+(error?" err":"");}
async function init(){
 try{
  const hash=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  const err=hash.get("error_description")||query.get("error_description");
  if(err)throw new Error(err.replace(/\+/g," "));
  const code=query.get("code");
  if(code){
   const {error}=await sb.auth.exchangeCodeForSession(code);
   if(error)throw error;
  }
  const {data:{session},error}=await sb.auth.getSession();
  if(error)throw error;
  if(!session)throw new Error("Der Link ist ungültig oder abgelaufen. Bitte fordere eine neue Passwort-Mail an.");
  $("loading").classList.add("hidden");$("form").classList.remove("hidden");
 }catch(e){$("loading").classList.add("hidden");show(e.message||"Der Link konnte nicht geprüft werden.",true);$("back").classList.remove("hidden")}
}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();const a=$("pw").value,b=$("pw2").value;
 if(a.length<8){show("Bitte verwende mindestens 8 Zeichen.",true);return}
 if(a!==b){show("Die beiden Passwörter stimmen nicht überein.",true);return}
 $("save").disabled=true;
 try{
  const {error}=await sb.auth.updateUser({password:a});
  if(error)throw error;
  $("form").classList.add("hidden");show("Dein Passwort wurde gespeichert. Du kannst dich jetzt anmelden.");
  $("back").classList.remove("hidden");
  await sb.auth.signOut();
 }catch(e){show(e.message||"Passwort konnte nicht gespeichert werden.",true)}
 finally{$("save").disabled=false}
});
init();
</script>
</body></html>
